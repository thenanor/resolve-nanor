openapi: 3.0.3
info:
  title: Resolve API
  description: >-
    Resolve v0 Core Tickets — a small ticketing system. Mutating endpoints
    accept an optional `X-Actor` header (defaults to `api`) recorded against
    the audit log.
  version: "0.1.0"
servers:
  - url: /
tags:
  - name: tickets
  - name: audit
  - name: stats
  - name: health

paths:
  /health:
    get:
      tags: [health]
      summary: Service health and uptime
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /tickets:
    post:
      tags: [tickets]
      summary: Create a ticket
      parameters:
        - $ref: "#/components/parameters/XActor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [tickets]
      summary: List tickets
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/Status"
        - name: priority
          in: query
          schema:
            $ref: "#/components/schemas/Priority"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"

  /tickets/{id}:
    get:
      tags: [tickets]
      summary: Get a ticket by id, including comments
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          $ref: "#/components/responses/NotFound"

  /tickets/{id}/status:
    post:
      tags: [tickets]
      summary: Transition a ticket's status
      description: >-
        Only whitelisted transitions are allowed: new→open, open→in_progress,
        in_progress→waiting_customer|resolved, waiting_customer→in_progress,
        resolved→closed. Illegal moves return 400 listing the allowed next
        states.
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/XActor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  $ref: "#/components/schemas/Status"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /tickets/{id}/comments:
    post:
      tags: [tickets]
      summary: Add a comment to a ticket
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/XActor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /audit:
    get:
      tags: [audit]
      summary: List audit entries, optionally filtered by ticket
      parameters:
        - name: ticketId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"

  /stats:
    get:
      tags: [stats]
      summary: Ticket counts by status/priority and average resolution time
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"

components:
  parameters:
    TicketId:
      name: id
      in: path
      required: true
      schema:
        type: string
    XActor:
      name: X-Actor
      in: header
      required: false
      description: Recorded as the audit-log actor. Defaults to `api`.
      schema:
        type: string
        default: api

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Ticket not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      example:
        message: "ticket tkt_01 not found"

    HealthResponse:
      type: object
      properties:
        service:
          type: string
          example: resolve
        version:
          type: string
          example: dev
        uptimeSeconds:
          type: number
          format: double

    Priority:
      type: string
      enum: [low, normal, high, urgent]

    Status:
      type: string
      enum: [new, open, in_progress, waiting_customer, resolved, closed]

    CreateTicketRequest:
      type: object
      required: [subject, description, customerEmail, priority]
      properties:
        subject:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        customerEmail:
          type: string
          format: email
        priority:
          $ref: "#/components/schemas/Priority"

    CreateCommentRequest:
      type: object
      required: [author, body]
      properties:
        author:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
        internal:
          type: boolean
          default: false
          description: Internal notes are agent-only, never exposed to customers.

    Comment:
      type: object
      properties:
        id:
          type: string
        author:
          type: string
        body:
          type: string
        internal:
          type: boolean
        at:
          type: string
          format: date-time

    Ticket:
      type: object
      properties:
        id:
          type: string
        subject:
          type: string
        description:
          type: string
        customerEmail:
          type: string
          format: email
        priority:
          $ref: "#/components/schemas/Priority"
        status:
          $ref: "#/components/schemas/Status"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true

    AuditEntry:
      type: object
      properties:
        actor:
          type: string
        action:
          type: string
          example: ticket.status_changed
        ticketId:
          type: string
        details:
          type: object
          additionalProperties: true
        at:
          type: string
          format: date-time

    StatsResponse:
      type: object
      properties:
        total:
          type: integer
        byStatus:
          type: object
          additionalProperties:
            type: integer
        byPriority:
          type: object
          additionalProperties:
            type: integer
        avgResolutionMinutes:
          type: integer
          nullable: true
